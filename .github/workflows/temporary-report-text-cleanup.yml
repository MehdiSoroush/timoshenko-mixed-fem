name: One-time publication report correction
on:
  push:
    branches:
      - editorial/authored-documentation-2026-11
permissions:
  contents: write
jobs:
  correct-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pymupdf
      - name: Synchronize PDF text with the revised Markdown
        run: |
          python - <<'PY'
          import fitz
          from pathlib import Path
          target = Path('docs/Technical_Report.pdf')
          original = "Activate the environment using your operating system's command."
          replacement = "# Activate the virtual environment for the operating system."
          doc = fitz.open(target)
          count = 0
          already = False
          for page in doc:
              if page.search_for('Activate the virtual environment for the operating system.'):
                  already = True
              spans = [
                  span for block in page.get_text('dict')['blocks'] if block['type'] == 0
                  for line in block['lines'] for span in line['spans']
                  if original in span['text']
              ]
              for span in spans:
                  box = fitz.Rect(span['bbox'])
                  page.add_redact_annot(box, fill=(1, 1, 1), cross_out=False)
                  page.apply_redactions(images=0, graphics=0, text=0)
                  page.insert_text((box.x0, box.y1-3), replacement,
                                   fontname='Times-Italic', fontsize=9.5,
                                   color=(0.1, 0.1, 0.1))
                  count += 1
          if count:
              assert count == 1, f'Unexpected PDF correction count: {count}'
              temp = target.with_suffix('.tmp.pdf')
              doc.save(temp, garbage=4, deflate=True)
              doc.close()
              temp.replace(target)
              verify = fitz.open(target)
              assert not any(p.search_for(original) for p in verify)
              assert any(p.search_for('Activate the virtual environment for the operating system.') for p in verify)
              print('Corrected and verified one line of the PDF.')
          else:
              doc.close()
              assert already, 'Neither old nor new sentence found in the report.'
              print('PDF already contains the revised text.')
          PY
      - name: Commit corrected PDF if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/Technical_Report.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: synchronize report PDF with editorial correction [skip ci]"
            git push origin HEAD:editorial/authored-documentation-2026-11
          fi
